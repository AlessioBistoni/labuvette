# Decap CMS — sostituisci repo GitHub e abilita OAuth come da documentazione.
# Sviluppo locale: in un altro terminale esegui `npx decap-server` dalla root del repo
# (inietta automaticamente il backend locale).
# https://decapcms.org/docs/backends-overview/

backend:
  name: github
  repo: tuo-utente/labuvette # ← sostituisci con owner/repo GitHub
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Articoli
    label_singular: Articolo
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Slug (nome file, senza spazi)
        name: slug
        widget: string
      - { label: Titolo, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Autore, name: author, widget: string, required: false }
      - { label: Copertina (path /covers/... o URL https), name: cover, widget: string, required: false }
      - { label: Estratto, name: excerpt, widget: text, required: false }
      - { label: Corpo, name: body, widget: markdown }
